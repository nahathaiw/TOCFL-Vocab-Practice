<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TOCFL Vocab Practice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ffffff; --surface:#f6f7f8; --line:#e4e6e9; --text:#16181b; --muted:#6b7077;
  --accent:#0f766e; --accent-soft:#e6f3f1; --good:#15803d; --good-soft:#e8f5ec; --bad:#c2410c; --bad-soft:#fdeee6;
  --radius:12px; --shadow:0 1px 2px rgba(0,0,0,.04),0 4px 16px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#121416;--surface:#1b1e21;--line:#2c3035;--text:#eceef0;--muted:#9aa0a6;
  --accent:#2dd4bf;--accent-soft:#163532;--good:#4ade80;--good-soft:#173322;--bad:#fb923c;--bad-soft:#3a2416;--shadow:none}
}
:root[data-theme="dark"]{--bg:#121416;--surface:#1b1e21;--line:#2c3035;--text:#eceef0;--muted:#9aa0a6;
  --accent:#2dd4bf;--accent-soft:#163532;--good:#4ade80;--good-soft:#173322;--bad:#fb923c;--bad-soft:#3a2416;--shadow:none}
:root[data-theme="dark"] .btn:not(.plain):not(.ghost):not(.learn), :root[data-theme="dark"] .chip.on, :root[data-theme="dark"] .seg button.on, :root[data-theme="dark"] .play{color:#0b1412}
.hbtns{display:flex;gap:8px}
body{transition:background .2s,color .2s}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font-family:Inter,"Noto Sans TC",system-ui,-apple-system,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}
.zh{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:860px;margin:0 auto;padding:0 16px 64px}
header{display:flex;align-items:center;justify-content:space-between;padding:20px 0 8px;gap:12px}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:36px;height:36px;border-radius:10px;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:700;font-size:18px}
.brand h1{font-size:18px;margin:0;font-weight:700;letter-spacing:-.01em}
.brand p{margin:0;font-size:13px;color:var(--muted)}
.iconbtn{border:1px solid var(--line);background:var(--bg);border-radius:10px;height:38px;min-width:38px;padding:0 12px;display:inline-flex;align-items:center;gap:6px;font-size:14px}
.iconbtn:hover{background:var(--surface)}
section.block{margin-top:24px}
.block h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 10px;font-weight:600;display:flex;align-items:center;gap:8px;justify-content:space-between}
.block h2 .links{text-transform:none;letter-spacing:0;font-weight:500}
.linkbtn{background:none;border:0;color:var(--accent);font-size:13px;padding:2px 4px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:7px 14px;font-size:14px;display:inline-flex;align-items:center;gap:6px;transition:background .15s,border-color .15s}
.chip:hover{border-color:var(--muted)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.chip .n{font-size:12px;opacity:.65}
.chip:disabled{opacity:.35;cursor:not-allowed}
.level{border-radius:var(--radius);flex-direction:column;align-items:flex-start;gap:0;padding:10px 14px;min-width:104px}
.level b{font-size:15px}
.level small{font-size:12px;opacity:.75}
.posgroup{margin-bottom:10px}
.posgroup .label{font-size:12px;color:var(--muted);margin-bottom:6px}
.note{font-size:13px;color:var(--muted);margin:8px 0 0}
.poshelp{display:none;margin-top:12px;border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;background:var(--surface);font-size:13px}
.poshelp.show{display:block}
.poshelp dl{display:grid;grid-template-columns:max-content 1fr;gap:4px 14px;margin:0}
.poshelp dt{font-weight:600}
.poshelp dd{margin:0;color:var(--muted)}
.matchbar{margin-top:24px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:14px 16px;border-radius:var(--radius);background:var(--accent-soft)}
.matchbar .count{font-size:15px}
.matchbar .count b{font-size:22px;color:var(--accent);margin-right:4px}
.toggle{display:inline-flex;align-items:center;gap:8px;font-size:14px;cursor:pointer;user-select:none}
.toggle input{width:16px;height:16px;accent-color:var(--accent)}
.modes{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:12px}
.mode{border:1px solid var(--line);border-radius:var(--radius);background:var(--bg);padding:18px 16px;text-align:left;box-shadow:var(--shadow);transition:transform .12s,border-color .12s}
.mode:hover:not(:disabled){border-color:var(--accent);transform:translateY(-1px)}
.mode:disabled{opacity:.4;cursor:not-allowed}
.mode .ic{font-size:22px}
.mode b{display:block;margin-top:6px;font-size:16px}
.mode span{font-size:13px;color:var(--muted)}
.progress{border:1px solid var(--line);border-radius:var(--radius);padding:6px 16px}
.prow{display:grid;grid-template-columns:110px 1fr 90px;align-items:center;gap:12px;padding:8px 0;font-size:14px;border-bottom:1px solid var(--line)}
.prow:last-child{border-bottom:0}
.bar{height:8px;border-radius:99px;background:var(--surface);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.prow .num{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums;font-size:13px}
.mistakes{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:12px;padding:12px 16px;border:1px solid var(--line);border-radius:var(--radius)}
.btn{border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:10px;padding:10px 18px;font-size:15px;font-weight:500}
.btn.ghost{background:var(--bg);color:var(--accent)}
.btn.plain{background:var(--bg);color:var(--text);border-color:var(--line)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.sm{padding:6px 12px;font-size:13px}
/* study */
.studyhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:16px}
.studyhead .meta{font-size:14px;color:var(--muted)}
.pbar{height:4px;background:var(--surface);border-radius:4px;margin-top:12px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--accent);transition:width .25s}
.card{margin:20px auto 0;max-width:560px;min-height:340px;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px 24px;text-align:center;cursor:pointer;position:relative;user-select:none}
.card .hanzi{font-size:clamp(44px,11vw,76px);font-weight:500;line-height:1.2;word-break:break-all}
.card .hint{position:absolute;bottom:14px;font-size:12px;color:var(--muted)}
.card .tags{position:absolute;top:14px;left:16px;right:16px;display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.card .roman{font-size:22px;color:var(--accent);margin-top:10px}
.card .en{font-size:20px;margin-top:8px}
.card .noen{font-size:14px;color:var(--muted);margin-top:8px}
.pill{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:12px;color:var(--muted);margin:10px 3px 0}
.speak{border:1px solid var(--line);background:var(--bg);border-radius:999px;width:44px;height:44px;font-size:18px;margin-top:14px}
.speak:hover{background:var(--surface)}
.actions{display:flex;justify-content:center;gap:10px;margin-top:18px;flex-wrap:wrap}
.actions .know{background:var(--good);border-color:var(--good)}
.actions .learn{background:var(--bg);color:var(--bad);border-color:var(--bad)}
.status{font-size:13px;margin-top:10px;text-align:center;min-height:20px;color:var(--muted)}
.qbox{margin:20px auto 0;max-width:600px}
.prompt{border:1px solid var(--line);border-radius:18px;padding:28px 20px;text-align:center;box-shadow:var(--shadow)}
.prompt .ask{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.prompt .q{font-size:clamp(28px,7vw,52px);margin-top:8px;line-height:1.25;word-break:break-word}
.prompt .q.small{font-size:clamp(22px,5vw,30px)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.opt{border:1px solid var(--line);background:var(--bg);border-radius:var(--radius);padding:16px 14px;font-size:17px;text-align:left;display:flex;gap:10px;align-items:center;min-height:62px}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .k{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:6px;min-width:22px;height:22px;display:grid;place-items:center;flex:none}
.opt.big{font-size:26px}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default}
.feedback{margin-top:14px;padding:12px 16px;border-radius:var(--radius);font-size:15px;display:none}
.feedback.show{display:block}
.feedback.ok{background:var(--good-soft)}
.feedback.no{background:var(--bad-soft)}
.result{text-align:center;margin-top:28px}
.result .score{font-size:64px;font-weight:700;color:var(--accent);line-height:1}
.reviewlist{max-width:600px;margin:20px auto 0;border:1px solid var(--line);border-radius:var(--radius);text-align:left}
.reviewlist div{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;padding:10px 16px;border-bottom:1px solid var(--line);font-size:14px}
.reviewlist div:last-child{border-bottom:0}
.reviewlist .w{font-size:20px;grid-row:span 2}
.listen{display:flex;flex-direction:column;align-items:center;gap:12px}
.play{width:96px;height:96px;border-radius:50%;border:0;background:var(--accent);color:#fff;font-size:34px;box-shadow:var(--shadow)}
.empty{text-align:center;color:var(--muted);padding:40px 16px}
/* settings */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:flex-start;justify-content:center;padding:60px 16px;z-index:10}
.overlay.show{display:flex}
.panel{background:var(--bg);border-radius:16px;width:100%;max-width:420px;padding:20px;box-shadow:0 10px 40px rgba(0,0,0,.2)}
.panel h3{margin:0 0 14px;font-size:18px;display:flex;justify-content:space-between;align-items:center}
.setrow{padding:14px 0;border-top:1px solid var(--line)}
.setrow label.t{display:block;font-size:13px;color:var(--muted);margin-bottom:8px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--bg);padding:8px 16px;font-size:14px}
.seg button.on{background:var(--accent);color:#fff}
.hidden{display:none!important}
.rangerow{display:flex;align-items:center;gap:14px;margin-top:14px}
.rangerow input{flex:1;accent-color:var(--accent);height:28px}
.rangerow b{min-width:34px;text-align:right;font-size:18px;color:var(--accent);font-variant-numeric:tabular-nums}
.rangeticks{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-right:48px}
.helppanel{max-width:520px;max-height:calc(100vh - 80px);overflow-y:auto}
.helppanel ol{margin:0;padding-left:20px}
.helppanel li{margin:0 0 12px;font-size:15px;line-height:1.55}
.helppanel li b{color:var(--accent)}
.helppanel .tip{font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px;margin-top:4px}
.typebox{display:flex;gap:10px;margin-top:14px}
.typein{flex:1;min-width:0;font-size:28px;padding:12px 16px;border:2px solid var(--line);border-radius:var(--radius);background:var(--bg);color:var(--text);font-family:"Noto Sans TC","PingFang TC",sans-serif;outline:none}
.typein:focus{border-color:var(--accent)}
.typein.ok{border-color:var(--good);background:var(--good-soft)}
.typein.no{border-color:var(--bad);background:var(--bad-soft)}
.typehelp{display:flex;justify-content:center;gap:8px;margin-top:10px;flex-wrap:wrap}
.diff{font-size:30px;letter-spacing:2px}
.diff .g{color:var(--good)} .diff .x{color:var(--bad);text-decoration:line-through}
.hintline{font-size:13px;color:var(--muted);text-align:center;margin-top:8px}
.sumbtn{display:none}
.lbl{display:inline-flex;align-items:baseline;gap:6px}
.lbl small{font-size:12px;opacity:.65}
.cardbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:560px;margin:18px auto 0}
.cardbtns .btn{padding:14px;font-size:16px}
.cardbtns .know{background:var(--good);border-color:var(--good)}
.cardbtns .learn{background:var(--bg);color:var(--bad);border-color:var(--bad)}
.navbtns{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;max-width:560px;margin:6px auto 0}
.navbtns #shuf{font-size:14px}
footer{margin-top:40px;font-size:12px;color:var(--muted);text-align:center}
@media (max-width:640px){
  body{font-size:16px}
  .wrap{padding:0 18px 56px}
  header{padding:18px 0 4px}
  .brand p,.setlbl{display:none}
  .brand h1{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .brand{gap:8px;min-width:0;flex:1}
  .brand>div:last-child{min-width:0}
  .hbtns .iconbtn{min-width:38px;height:38px;padding:0 8px}
  .logo{width:32px;height:32px;font-size:16px;flex:none}
  .hbtns{gap:6px;flex:none}
  .hbtns .iconbtn{height:40px;min-width:40px;padding:0 10px;font-size:16px}
  .overlay{padding:24px 12px}
  section.block{margin-top:30px}
  .block h2{font-size:12px;margin-bottom:12px}
  /* levels: tidy 2-column grid */
  #levels{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .level{min-width:0;padding:12px 14px}
  .level b{font-size:16px}
  /* collapsible filters */
  .sumbtn{display:flex;width:100%;align-items:center;justify-content:space-between;gap:10px;border:1px solid var(--line);background:var(--bg);border-radius:var(--radius);padding:14px 16px;font-size:15px;text-align:left;min-height:52px}
  .sumbtn .sumtxt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sumbtn .chev{color:var(--muted);transition:transform .2s}
  .collapsible.open .sumbtn .chev{transform:rotate(180deg)}
  .collapsible .body{display:none;margin-top:12px}
  .collapsible.open .body{display:block}
  #topics{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  #topics .chip{border-radius:12px;justify-content:space-between;align-items:center;padding:10px 12px;min-height:56px;text-align:left}
  #topics .chip[data-tp="all"]{grid-column:1 / -1;justify-content:center;min-height:46px}
  #topics .lbl{flex-direction:column;gap:0;align-items:flex-start;line-height:1.3}
  #pos .chips{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  #pos .chip{justify-content:center;border-radius:10px;min-height:46px;padding:8px 6px}
  #pos .posgroup:first-child .chips{grid-template-columns:1fr}
  .posgroup{margin-bottom:16px}
  .posgroup .label{font-size:13px;margin-bottom:8px}
  .poshelp dl{grid-template-columns:70px 1fr;gap:8px 12px}
  .note{font-size:14px;line-height:1.5}
  /* match + modes */
  .matchbar{margin-top:30px;flex-direction:column;align-items:flex-start;gap:10px}
  .modes{grid-template-columns:1fr;gap:10px}
  .mode{display:grid;grid-template-columns:40px 1fr;grid-template-rows:auto auto;column-gap:12px;align-items:center;padding:14px 16px}
  .mode .ic{grid-row:1 / 3;font-size:24px;text-align:center}
  .mode b{margin-top:0}
  .prow{grid-template-columns:76px 1fr 76px;padding:10px 0}
  .mistakes{flex-direction:column;align-items:stretch}
  .mistakes .btn{flex:1}
  /* study */
  .card{min-height:300px;padding:40px 18px 34px}
  .opts{grid-template-columns:1fr}
  .opt{min-height:58px;padding:14px}
  .typein{font-size:24px}
  .typebox .btn{padding:10px 14px}
  .prompt{padding:24px 16px}
  .navbtns .btn{padding:10px 8px;font-size:14px}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="logo zh">華</div>
      <div><h1 data-t="title"></h1><p data-t="subtitle"></p></div>
    </div>
    <div class="hbtns"><button class="iconbtn" id="helpBtn" aria-label="How to use" style="font-weight:700">?</button><button class="iconbtn" id="themeBtn" aria-label="Toggle dark mode"></button>
    <button class="iconbtn" id="openSettings" aria-label="Settings">⚙ <span class="setlbl" data-t="settings"></span></button></div>
  </header>

  <!-- HOME -->
  <main id="home">
    <section class="block">
      <h2><span data-t="hLevel"></span><span class="links"><button class="linkbtn" id="lvAll" data-t="all"></button></span></h2>
      <div class="chips" id="levels"></div>
    </section>

    <section class="block collapsible" id="secTopic">
      <h2><span data-t="hTopic"></span><span class="links"><button class="linkbtn" id="tpAll" data-t="allClear"></button></span></h2>
      <button class="sumbtn" data-sec="secTopic"><span class="sumtxt" id="tpSum"></span><span class="chev">▾</span></button>
      <div class="body"><div class="chips" id="topics"></div></div>
      <p class="note" id="topicNote"></p>
    </section>

    <section class="block collapsible" id="secPos">
      <h2><span data-t="hPos"></span><span class="links"><button class="linkbtn" id="posHelpBtn" data-t="whatPos"></button> <button class="linkbtn" id="psAll" data-t="allClear"></button></span></h2>
      <button class="sumbtn" data-sec="secPos"><span class="sumtxt" id="psSum"></span><span class="chev">▾</span></button>
      <div class="body"><div id="pos"></div></div>
      <div class="poshelp" id="posHelp"><dl id="posHelpList"></dl></div>
    </section>

    <div class="matchbar">
      <div class="count"><b id="matchN">0</b><span data-t="match"></span></div>
      <label class="toggle"><input type="checkbox" id="skipKnown"><span data-t="skipKnown"></span></label>
    </div>

    <div class="modes">
      <button class="mode" data-mode="cards"><div class="ic">🂠</div><b data-t="mCards"></b><span data-t="mCardsD"></span></button>
      <button class="mode" data-mode="quiz"><div class="ic">✓</div><b data-t="mQuiz"></b><span data-t="mQuizD"></span></button>
      <button class="mode" data-mode="listen"><div class="ic">🔊</div><b data-t="mListen"></b><span data-t="mListenD"></span></button>
      <button class="mode" data-mode="type"><div class="ic">⌨</div><b data-t="mType"></b><span data-t="mTypeD"></span></button>
    </div>

    <section class="block">
      <h2><span data-t="hProgress"></span></h2>
      <div class="progress" id="progress"></div>
      <div class="mistakes">
        <div><b id="mistakeN">0</b> <span data-t="mistakesLbl"></span></div>
        <div style="display:flex;gap:8px">
          <button class="btn sm" id="reviewMistakes" data-t="reviewMistakes"></button>
          <button class="btn sm plain" id="clearMistakes" data-t="clear"></button>
        </div>
      </div>
    </section>
  </main>

  <!-- STUDY -->
  <main id="study" class="hidden">
    <div class="studyhead">
      <button class="iconbtn" id="back">← <span data-t="back"></span></button>
      <div class="meta" id="studyMeta"></div>
    </div>
    <div class="pbar"><i id="pbar" style="width:0"></i></div>
    <div id="stage"></div>
  </main>

  <footer data-t="footer"></footer>
</div>

<!-- HELP -->
<div class="overlay" id="help">
  <div class="panel helppanel">
    <h3><span data-t="helpT"></span><button class="iconbtn" id="closeHelp">✕</button></h3>
    <div id="helpBody"></div>
    <div style="text-align:right;margin-top:14px"><button class="btn" id="helpOk" data-t="gotIt"></button></div>
  </div>
</div>

<!-- SETTINGS -->
<div class="overlay" id="settings">
  <div class="panel">
    <h3><span data-t="settings"></span><button class="iconbtn" id="closeSettings">✕</button></h3>
    <div class="setrow">
      <label class="t" data-t="sLang"></label>
      <div class="seg" id="segLang"><button data-v="en">English</button><button data-v="zh">中文</button></div>
    </div>
    <div class="setrow">
      <label class="t" data-t="sRoman"></label>
      <div class="seg" id="segRoman"><button data-v="py">Pinyin</button><button data-v="zy">注音 ㄅㄆㄇ</button></div>
    </div>
    <div class="setrow">
      <label class="t" data-t="sTheme"></label>
      <div class="seg" id="segTheme"><button data-v="light">☀️ <span data-t="light"></span></button><button data-v="dark">🌙 <span data-t="dark"></span></button></div>
    </div>

  return p.replace(/ă/g,'ǎ').replace(/ĕ/g,'ě').replace(/ĭ/g,'ǐ').replace(/ŏ/g,'ǒ').replace(/ŭ/g,'ǔ').replace(/ɑ/g,'a')
          .replace(/Ă/g,'Ǎ').replace('gōnjǐ','gōngjǐ').replace(/yái/g,'yá').replace(/\s*\/\s*/g,' / ').replace(/\s+/g,' ').trim();
}

  i:'ㄧ',ia:'ㄧㄚ',ie:'ㄧㄝ',iao:'ㄧㄠ',iu:'ㄧㄡ',ian:'ㄧㄢ',in:'ㄧㄣ',iang:'ㄧㄤ',ing:'ㄧㄥ',iong:'ㄩㄥ',
  u:'ㄨ',ua:'ㄨㄚ',uo:'ㄨㄛ',uai:'ㄨㄞ',ui:'ㄨㄟ',uan:'ㄨㄢ',un:'ㄨㄣ',uang:'ㄨㄤ',
  v:'ㄩ',ve:'ㄩㄝ',van:'ㄩㄢ',vn:'ㄩㄣ'};
const YW = {yi:'ㄧ',ya:'ㄧㄚ',ye:'ㄧㄝ',yao:'ㄧㄠ',you:'ㄧㄡ',yan:'ㄧㄢ',yin:'ㄧㄣ',yang:'ㄧㄤ',ying:'ㄧㄥ',yong:'ㄩㄥ',yo:'ㄧㄛ',
  yu:'ㄩ',yue:'ㄩㄝ',yuan:'ㄩㄢ',yun:'ㄩㄣ',wu:'ㄨ',wa:'ㄨㄚ',wo:'ㄨㄛ',wai:'ㄨㄞ',wei:'ㄨㄟ',wan:'ㄨㄢ',wen:'ㄨㄣ',wang:'ㄨㄤ',weng:'ㄨㄥ'};
const SYL = {};
(function buildSyl(){
  Object.assign(SYL,YW);
  ['a','o','e','ai','ei','ao','ou','an','en','ang','eng','er'].forEach(f=>SYL[f]=FIN[f]);
  ['zh','ch','sh','r','z','c','s'].forEach(i=>SYL[i+'i']=INIT[i]);
  for(const i in INIT){ for(const f in FIN){
    if(f==='er') continue;
    let fz=FIN[f], key=i+f;
    if('jqx'.includes(i)){ if(f[0]==='u'){ const vf='v'+f.slice(1); if(!FIN[vf]) continue; fz=FIN[vf]; } else if(f[0]==='v') continue; else if(!['i','ia','ie','iao','iu','ian','in','iang','ing','iong'].includes(f)) continue; }
    if(f==='i' && ['zh','ch','sh','r','z','c','s'].includes(i)) continue;
    SYL[key]=SYL[key]||INIT[i]+fz;
  }}
  SYL['r']='ㄦ'; // erhua
})();
const TONE_CH = {'ā':['a',1],'á':['a',2],'ǎ':['a',3],'à':['a',4],'ē':['e',1],'é':['e',2],'ě':['e',3],'è':['e',4],
  'ī':['i',1],'í':['i',2],'ǐ':['i',3],'ì':['i',4],'ō':['o',1],'ó':['o',2],'ǒ':['o',3],'ò':['o',4],
  'ū':['u',1],'ú':['u',2],'ǔ':['u',3],'ù':['u',4],'ǖ':['v',1],'ǘ':['v',2],'ǚ':['v',3],'ǜ':['v',4],'ü':['v',0]};
const TONE_MARK = ['˙','','ˊ','ˇ','ˋ'];
function runToZhuyin(run){
  let base='', tones=[];
  for(const ch of run.toLowerCase()){ const t=TONE_CH[ch]; if(t){base+=t[0];tones.push(t[1]);} else {base+=ch;tones.push(0);} }
  const n=base.length, best=new Array(n+1).fill(null); best[0]={cost:0,parts:[]};
  for(let i=0;i<n;i++){ if(!best[i]) continue;
    for(let L=1;L<=6&&i+L<=n;L++){ const s=base.slice(i,i+L); if(!SYL[s]) continue;
      const cost=best[i].cost+(s==='r'?5:1);
      if(!best[i+L]||cost<best[i+L].cost) best[i+L]={cost,parts:best[i].parts.concat([[i,i+L,s]])};
    }}
  if(!best[n]) return run;
  return best[n].parts.map(([a,b,s])=>{
    let tone=0; for(let k=a;k<b;k++) if(tones[k]) tone=tones[k];
    const z=SYL[s]; if(s==='r') return z;
    return tone===0 ? '˙'+z : z+TONE_MARK[tone];
  }).join(' ');
}
function toZhuyin(py){ return py.replace(/[a-zA-Zāáǎàēéěèīíǐìōóǒòūúǔùǖǘǚǜü]+/g,runToZhuyin); }
const zyCache={};
function roman(w){ if(S.roman==='zy'){ return zyCache[w.id]||(zyCache[w.id]=toZhuyin(w.py)); } return w.py; }

function load(k,d){ try{ const v=localStorage.getItem('tocfl_'+k); return v?JSON.parse(v):d; }catch(e){ return d; } }
function save(k,v){ try{ localStorage.setItem('tocfl_'+k,JSON.stringify(v)); }catch(e){} }
const S = Object.assign({lang:'en',roman:'py',round:10,levels:['N1'],topics:[],pos:[],skipKnown:false}, load('settings',{}));
let P = load('progress',{known:{},learning:{},mistakes:{}});
function saveS(){ save('settings',S); } function saveP(){ save('progress',P); }
const t = k => (T[S.lang][k] ?? T.en[k] ?? k);
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const topicName = i => i<0 ? '' : (S.lang==='zh' ? TOPICS[i][0] : TOPICS[i][1]);
const levelName = id => { const l=LEVELS.find(x=>x.id===id); return S.lang==='zh'? l.zh : l.en; };

/* ---------- filtering ---------- */
function filtered(opts={}){
  const lv=new Set(S.levels), tp=new Set(S.topics), ps=new Set(S.pos);
  return WORDS.filter(w=> lv.has(w.lv)
    && (opts.ignoreTopic || tp.size===0 || tp.has(w.tp))
    && (opts.ignorePos || ps.size===0 || w.pos.some(p=>ps.has(p)))
    && (!S.skipKnown || opts.ignoreKnown || !P.known[w.id]));
}

  // count + modes

/* ---------- speech ---------- */
let zhVoice=null;
function pickVoice(){ if(!('speechSynthesis' in window)) return;
  const vs=speechSynthesis.getVoices();
  zhVoice = vs.find(v=>/zh[-_]TW/i.test(v.lang)) || vs.find(v=>/zh[-_](HK|Hant)/i.test(v.lang)) || vs.find(v=>/^zh/i.test(v.lang)) || null; }
if('speechSynthesis' in window){ pickVoice(); speechSynthesis.onvoiceschanged=pickVoice; }
function speakText(w){ return w.w.split('/')[0].replace(/[()]/g,''); }
function speak(w,rate=0.85){
  if(!('speechSynthesis' in window)) return false;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(speakText(w)); u.lang='zh-TW'; u.rate=rate; if(zhVoice) u.voice=zhVoice;
  speechSynthesis.speak(u); return true;
}

let session=null;
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.random()*(i+1)|0; [a[i],a[j]]=[a[j],a[i]]; } return a; };

  if(!pool.length) return;
  session = mode==='cards' ? Cards(pool) : (mode==='type' ? Typing(pool) : Quiz(pool, mode==='listen', fromMistakes));

function Cards(pool){
  let list=shuffle(pool), i=0, flipped=false, msg='';
  const s={ render(){
    const w=list[i];
    $('#studyMeta').textContent = `${t('mCards')} · ${t('card')} ${i+1} ${t('of')} ${list.length}`;
    setBar(i+1,list.length);
    const state = P.known[w.id] ? '✓ '+t('know') : (P.learning[w.id] ? '… '+t('learning') : '');
    $('#stage').innerHTML = `
      <div class="card" id="card">
        <div class="tags"><span>${levelName(w.lv)}${w.tp>=0?' · <span class="zh">'+esc(topicName(w.tp))+'</span>':''}</span><span>${state}</span></div>
        <div class="hanzi zh">${esc(w.w)}</div>
        ${flipped ? `<div class="roman zh">${esc(roman(w))}</div>
          ${w.en?`<div class="en">${esc(w.en)}</div>`:`<div class="noen">${t('noEn')}</div>`}
          <div>${w.pos.map(p=>`<span class="pill" title="${esc(POS_INFO[p]?POS_INFO[p][S.lang==='zh'?1:0]:p)}">${p} · ${esc(POS_INFO[p]?POS_INFO[p][S.lang==='zh'?1:0]:p)}</span>`).join('')}</div>` : ''}
        <button class="speak" id="spk" title="Play">🔊</button>
        <div class="hint">${flipped?'':t('flip')}</div>
      </div>
      <div class="cardbtns">
        <button class="btn learn" id="learn">${t('learning')}</button>
        <button class="btn know" id="know">${t('know')}</button>
      </div>
      <div class="status">${msg}</div>
      <div class="navbtns">
        <button class="btn plain" id="prev" ${i===0?'disabled':''}>${t('prev')}</button>
        <button class="btn plain" id="shuf">⇄ ${t('shuffle')}</button>
        <button class="btn plain" id="next" ${i===list.length-1?'disabled':''}>${t('next')}</button>
      </div>`;
    $('#card').onclick=e=>{ if(e.target.id==='spk') return; flipped=!flipped; msg=''; s.render(); };
    $('#spk').onclick=()=>speak(w);
    $('#prev').onclick=()=>s.go(-1); $('#next').onclick=()=>s.go(1);
    $('#know').onclick=()=>s.mark(true); $('#learn').onclick=()=>s.mark(false);
    $('#shuf').onclick=()=>{ list=shuffle(list); i=0; flipped=false; msg=''; s.render(); };
  },
  go(d){ const j=i+d; if(j<0||j>=list.length) return; i=j; flipped=false; msg=''; s.render(); },
  mark(k){ const w=list[i];
    if(k){ P.known[w.id]=1; delete P.learning[w.id]; } else { P.learning[w.id]=1; delete P.known[w.id]; }
    saveP(); msg = k? t('known') : t('learn');
    if(i<list.length-1){ i++; flipped=false; } s.render(); },
  key(e){ if(e.code==='Space'){ e.preventDefault(); flipped=!flipped; msg=''; s.render(); }
    else if(e.key==='ArrowRight') s.go(1); else if(e.key==='ArrowLeft') s.go(-1);
    else if(e.key==='k') s.mark(true); else if(e.key==='l') s.mark(false); }
  };
  return s;
}

function makeQuestion(w,listen,pool){
  let type;
  if(listen) type='listen'; else type = w.en ? (Math.random()<.5?'c2e':'e2c') : (Math.random()<.5?'c2p':'p2c');
  const key = x => type==='c2e' ? x.en : (type==='c2p' ? x.py : x.w);
  const same = x => x.id!==w.id && key(x) && key(x)!==key(w) && (type!=='c2e' || x.en) && !(type==='e2c' && !x.en);
  const sources = [pool.filter(x=>same(x)&&x.pos.some(p=>w.pos.includes(p))), pool.filter(same),
                   byLevel[w.lv].filter(same), WORDS.filter(x=>same(x)&&(type!=='e2c'||x.en))];
  const picked=[], seen=new Set([key(w)]);
  for(const src of sources){ for(const x of shuffle(src)){ if(picked.length>=3) break; if(seen.has(key(x))) continue; seen.add(key(x)); picked.push(x); } if(picked.length>=3) break; }
  return {w,type,opts:shuffle([w,...picked])};
}
function Quiz(pool,listen,fromMistakes){
  let order=shuffle(pool).slice(0,Math.min(S.round,pool.length)), qi=0, score=0, answered=null, wrongs=[], q=null;
  const next=()=>{ q=makeQuestion(order[qi],listen,pool); answered=null; };
  next();
  const label = x => q.type==='c2e' ? esc(x.en) : (q.type==='c2p' ? `<span class="zh">${esc(roman(x))}</span>` : `<span class="zh">${esc(x.w)}</span>`);
  const s={ render(){
    const name = listen? t('mListen') : (fromMistakes? t('reviewMistakes') : t('mQuiz'));
    if(qi>=order.length){ return s.result(name); }
    const w=q.w;
    $('#studyMeta').textContent = `${name} · ${t('question')} ${qi+1} ${t('of')} ${order.length} · ✓ ${score}`;
    setBar(qi,order.length);
    let promptHtml;
    if(q.type==='listen'){
      const hasTTS='speechSynthesis' in window;
      promptHtml = `<div class="prompt listen"><div class="ask">${t('askListen')}</div>
        ${hasTTS?`<button class="play" id="play" aria-label="${t('replay')}">▶</button>
        <div style="display:flex;gap:8px"><button class="btn sm plain" id="rep">↻ ${t('replay')}</button><button class="btn sm plain" id="slow">🐢 ${t('slow')}</button></div>`
        :`<p class="note">${t('noVoice')}</p>`}
        ${answered?`<div class="q small zh" style="margin-top:6px">${esc(w.w)} · ${esc(roman(w))}</div>`:''}</div>`;
    } else {
      const ask = {c2e:'askMeaning',e2c:'askChar',c2p:'askPinyin',p2c:'askCharFromPy'}[q.type];
      const qtxt = q.type==='e2c' ? esc(w.en) : (q.type==='p2c' ? esc(roman(w)) : esc(w.w));
      promptHtml = `<div class="prompt"><div class="ask">${t(ask)}</div><div class="q zh ${q.type==='e2c'||q.type==='p2c'?'small':''}">${qtxt}</div>
        <button class="speak" id="spk" title="Play" ${q.type==='p2c'||q.type==='e2c'?(answered?'':'style="visibility:hidden"'):''}>🔊</button></div>`;
    }
    const big = q.type==='e2c'||q.type==='p2c'||q.type==='listen';
    $('#stage').innerHTML = `<div class="qbox">${promptHtml}
      <div class="opts">${q.opts.map((x,k)=>{
        let cls=''; if(answered){ if(x.id===w.id) cls='right'; else if(x.id===answered) cls='wrong'; }
        return `<button class="opt ${big?'big':''} ${cls}" data-k="${k}" ${answered?'disabled':''}><span class="k">${k+1}</span><span>${label(x)}</span></button>`; }).join('')}</div>
      <div class="feedback ${answered?'show '+(answered===w.id?'ok':'no'):''}">${answered? (answered===w.id? '<b>'+t('correct')+'</b> ' : t('wrongIs')+' ')
        + `<b class="zh">${esc(w.w)}</b> · <span class="zh">${esc(roman(w))}</span>${w.en?' · '+esc(w.en):''} · ${w.pos.join(', ')}` : ''}</div>
      <div class="actions">${answered?`<button class="btn" id="nextQ">${qi===order.length-1?t('finish'):t('nextQ')} →</button>`:''}</div></div>`;
    document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>s.answer(+b.dataset.k));
    if($('#nextQ')) $('#nextQ').onclick=()=>s.advance();
    if($('#spk')) $('#spk').onclick=()=>speak(w);
    if($('#play')){ $('#play').onclick=()=>speak(w); $('#rep').onclick=()=>speak(w); $('#slow').onclick=()=>speak(w,0.55); }
  },
  answer(k){ if(answered) return; const x=q.opts[k]; if(!x) return; answered=x.id;
    if(x.id===q.w.id){ score++; if(P.mistakes[q.w.id]) delete P.mistakes[q.w.id]; }
    else { wrongs.push(q.w); P.mistakes[q.w.id]=(P.mistakes[q.w.id]||0)+1; }
    saveP(); s.render(); if(q.type==='listen'||q.type==='c2e'||q.type==='c2p'){} },
  advance(){ qi++; if(qi<order.length){ next(); s.render(); if(listen) setTimeout(()=>speak(q.w),150); } else s.render(); },
  result(name){
    setBar(1,1);
    $('#studyMeta').textContent = name;
    const pct = Math.round(score/order.length*100);
    $('#stage').innerHTML = `<div class="result"><div class="ask note">${t('resultT')}</div>
      <div class="score">${score}/${order.length}</div><div class="note">${pct}%</div>
      <div class="actions"><button class="btn" id="again">${t('again')}</button><button class="btn plain" id="homeB">${t('home')}</button></div></div>
      ${wrongs.length?`<h3 style="text-align:center;margin-top:28px;font-size:15px">${t('reviewT')}</h3><div class="reviewlist">${
        wrongs.map(w=>`<div><span class="w zh">${esc(w.w)}</span><span class="zh">${esc(roman(w))} · ${w.pos.join(', ')}</span><span>${esc(w.en||'—')}</span></div>`).join('')}</div>`
        :`<p class="note" style="text-align:center">${t('perfect')}</p>`}`;
    $('#again').onclick=()=>{ const p = fromMistakes ? WORDS.filter(w=>P.mistakes[w.id]) : pool; if(!p.length){ $('#back').click(); return; } startMode(listen?'listen':'quiz', p, fromMistakes); };
    $('#homeB').onclick=()=>$('#back').click();
  },
  key(e){ if(/^[1-4]$/.test(e.key)) s.answer(+e.key-1);
    else if(e.key==='Enter' && answered) s.advance();
    else if((e.key==='r'||e.code==='Space') && listen){ e.preventDefault(); speak(q.w); } }
  };
  if(listen) setTimeout(()=>speak(q.w),300);
  return s;
}
function answersFor(w){
  const out=new Set();
  w.w.split('/').forEach(v=>{ v=v.trim(); out.add(v.replace(/[()]/g,'')); out.add(v.replace(/\([^)]*\)/g,'')); out.add(v.replace(/兒$/,'')); });
  out.delete(''); return [...out];
}
const cleanIn = s => s.replace(/[\s,，.。!！?？'"、/]/g,'');
function Typing(pool){
  let order=shuffle(pool).slice(0,Math.min(S.round,pool.length)), qi=0, score=0, state=null, typed='', hint=false, showPy=false, wrongs=[];
  const s={ render(){
    if(qi>=order.length) return s.result();
    const w=order[qi], ans=answersFor(w);
    $('#studyMeta').textContent = `${t('mType')} · ${t('question')} ${qi+1} ${t('of')} ${order.length} · ✓ ${score}`;
    setBar(qi,order.length);
    let fb='';
    if(state){
      const target = ans.find(a=>a.length===typed.length) || ans[0];
      const diff = [...target].map((c,k)=>`<span class="${typed[k]===c?'g':''}">${esc(c)}</span>`).join('');
      fb = `<div class="feedback show ${state==='ok'?'ok':'no'}">${state==='ok'?'<b>'+t('correct')+'</b> ':t('wrongIs')+' '}
        <span class="diff zh">${state==='ok'?esc(typed):diff}</span><br>
        ${state==='no'&&typed?`${t('typedWas')}: <span class="zh">${esc(typed)}</span><br>`:''}
        <span class="zh">${esc(w.w)} · ${esc(roman(w))}</span>${w.en?' · '+esc(w.en):''} · ${w.pos.join(', ')}</div>`;
    }
    $('#stage').innerHTML = `<div class="qbox">
      <div class="prompt"><div class="ask">${t('askType')}</div>
        ${w.en?`<div class="q small">${esc(w.en)}</div>`:''}
        ${(showPy||state||!w.en)?`<div class="roman zh" style="font-size:20px;color:var(--accent);margin-top:6px">${esc(roman(w))}</div>`:''}
        <div style="font-size:13px;color:var(--muted);margin-top:6px">${w.pos.join(', ')}${w.tp>=0?' · <span class="zh">'+esc(topicName(w.tp))+'</span>':''}</div>
        ${(showPy||state)?'<button class="speak" id="spk" title="Play">🔊</button>':''}</div>
      <div class="typebox"><input class="typein ${state||''}" id="typein" lang="zh-Hant" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
          placeholder="${t('typePh')}" value="${esc(typed)}" ${state?'disabled':''}>
        ${state?'':`<button class="btn" id="checkB">${t('check')}</button>`}</div>
      ${state?'':`<div class="typehelp">${showPy?'':`<button class="btn sm plain" id="pyB">🔤 ${S.roman==='zy'?t('showZy'):t('showPy')}</button>`}<button class="btn sm plain" id="hintB">💡 ${t('hint')}</button><button class="btn sm plain" id="giveB">${t('giveUp')}</button></div>
        <div class="hintline">${hint?`${t('hintShown')}: <b class="zh" style="font-size:20px;color:var(--text)">${esc(ans[0][0])}</b>${'＿'.repeat(Math.max(0,ans[0].length-1))}`:t('typeTip')}</div>`}
      ${fb}
      <div class="actions">${state?`<button class="btn" id="nextQ">${qi===order.length-1?t('finish'):t('nextQ')} →</button>`:''}</div></div>`;
    if($('#spk')) $('#spk').onclick=()=>speak(w);
    const inp=$('#typein');
    if(!state){
      inp.oninput=()=>{ typed=inp.value; };
      inp.onkeydown=e=>{ if(e.key==='Enter' && !e.isComposing && e.keyCode!==229){ e.preventDefault(); s.check(); } };
      $('#checkB').onclick=()=>s.check();
      $('#hintB').onclick=()=>{ typed=inp.value; hint=true; s.render(); };
      if($('#pyB')) $('#pyB').onclick=()=>{ typed=inp.value; showPy=true; s.render(); };
      $('#giveB').onclick=()=>{ typed=inp.value; s.grade(false); };
      setTimeout(()=>inp.focus(),50);
    } else { $('#nextQ').onclick=()=>s.advance(); $('#nextQ').focus(); }
  },
  check(){ const v=cleanIn($('#typein').value); typed=v; if(!v) return; s.grade(answersFor(order[qi]).includes(v)); },
  grade(ok){ const w=order[qi]; state=ok?'ok':'no'; typed=cleanIn(typed);
    if(ok){ score++; delete P.mistakes[w.id]; } else { wrongs.push(w); P.mistakes[w.id]=(P.mistakes[w.id]||0)+1; }
    saveP(); s.render(); speak(w); },
  advance(){ qi++; state=null; typed=''; hint=false; showPy=false; s.render(); },
  result(){
    setBar(1,1); $('#studyMeta').textContent=t('mType');
    $('#stage').innerHTML = `<div class="result"><div class="note">${t('resultT')}</div>
      <div class="score">${score}/${order.length}</div><div class="note">${Math.round(score/order.length*100)}%</div>
      <div class="actions"><button class="btn" id="again">${t('again')}</button><button class="btn plain" id="homeB">${t('home')}</button></div></div>
      ${wrongs.length?`<h3 style="text-align:center;margin-top:28px;font-size:15px">${t('reviewT')}</h3><div class="reviewlist">${
        wrongs.map(w=>`<div><span class="w zh">${esc(w.w)}</span><span class="zh">${esc(roman(w))} · ${w.pos.join(', ')}</span><span>${esc(w.en||'—')}</span></div>`).join('')}</div>`
        :`<p class="note" style="text-align:center">${t('perfect')}</p>`}`;
    $('#again').onclick=()=>startMode('type',pool); $('#homeB').onclick=()=>$('#back').click();
  },
  key(e){ if(e.key==='Enter' && state && document.activeElement?.id!=='typein'){ e.preventDefault(); s.advance(); } }
  };
  return s;
}
document.addEventListener('keydown',e=>{ if(session && !$('#study').classList.contains('hidden') && !$('#settings').classList.contains('show') && !$('#help').classList.contains('show')) session.key(e); if(e.key==='Escape'){ $('#settings').classList.remove('show'); if($('#help').classList.contains('show')) closeHelp(); } });

/* ---------- init ---------- */
S.levels = S.levels.filter(id=>LEVELS.some(l=>l.id===id)); if(!S.levels.length) S.levels=['N1'];
renderStatic(); renderHome();
if(!S.seenHelp) openHelp();
</script>
